<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>友好小天使 Friendship Angel - 大班社交禮儀互動遊戲</title>
  <style>
    :root {
      --bg-color: #090C12;
      --card-bg: #181E29;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF66;
      --panel-bg: #16181F;
      --border-color: #444854;
    }

    body.light-theme {
      --bg-color: #F2F5FA;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #009933;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #main-container, #main-container * {
      touch-action: manipulation;
    }

    #start-overlay, #break-overlay, #teacher-panel, .panel-card {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 0, 0.55);
      border-radius: 5px;
    }

    /* === 頂部狀態欄 === */
    #top-bar {
      position: fixed;
      top: 10px;
      left: 74px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      gap: 8px;
    }

    .top-badges-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.98rem;
      font-weight: 900;
      white-space: nowrap;
    }

    #progress-bar-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .progress-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 3px solid var(--card-border);
      background-color: transparent;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.filled {
      background-color: var(--card-border);
      transform: scale(1.15);
    }

    #replay-speech-btn {
      background: #FFFF00;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 20px;
      padding: 7px 15px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    #replay-speech-btn:active {
      transform: scale(0.95);
    }

    /* === 教師設定按鈕（左上角齒輪） === */
    #teacher-trigger {
      position: fixed;
      top: 10px;
      left: 12px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(80, 85, 95, 0.82);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }

    #teacher-trigger svg.gear-icon {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
    }

    /* === 主遊戲舞台（全螢幕無捲動） === */
    #main-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 66px 16px 16px 16px;
      gap: 10px;
      overflow: hidden;
    }

    /* 情境題目橫幅 */
    #question-banner {
      width: 100%;
      max-width: 1180px;
      background-color: var(--card-bg);
      border: 5px solid var(--card-border);
      border-radius: 24px;
      padding: 10px 20px;
      text-align: center;
      font-size: clamp(1.35rem, 2.7vw, 2.2rem);
      font-weight: 900;
      color: var(--text-color);
      line-height: 1.3;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* 大型全彩 SVG 故事插畫框 */
    #story-illustration-box {
      width: 100%;
      max-width: 780px;
      flex: 1;
      min-height: 0;
      background-color: #131B2E;
      border: 7px solid #00E5FF;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    body.light-theme #story-illustration-box {
      background-color: #E8F4FF;
      border-color: #002868;
    }

    #story-illustration-box svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      display: block;
    }

    /* 兩個特大圖文選擇按鈕區 */
    #choices-row {
      width: 100%;
      max-width: 1180px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(12px, 2.2vw, 26px);
      flex-shrink: 0;
    }

    @media (max-width: 720px) {
      #choices-row {
        grid-template-columns: 1fr;
      }
      #main-container {
        padding-top: 98px;
      }
    }

    .choice-btn {
      background-color: var(--card-bg);
      border: 7px solid var(--btn-accent, #FFFF00);
      border-radius: 26px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
      transition: transform 0.14s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.25s ease;
      text-align: left;
    }

    .choice-btn:active {
      transform: scale(0.96);
    }

    .choice-icon {
      font-size: clamp(2.4rem, 4.5vw, 3.6rem);
      line-height: 1;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: clamp(1.2rem, 2.2vw, 1.75rem);
      font-weight: 900;
      color: var(--subtext-color);
      line-height: 1.3;
    }

    /* 答對與答錯狀態 */
    .choice-btn.correct-selected {
      background-color: #00FF66 !important;
      border-color: #FFFFFF !important;
      transform: scale(1.03);
      box-shadow: 0 0 45px rgba(0, 255, 102, 0.9);
    }

    .choice-btn.correct-selected .choice-text {
      color: #000000 !important;
    }

    .choice-btn.faded-out {
      opacity: 0.25;
      pointer-events: none;
    }

    .choice-btn.gentle-shake {
      animation: gentleShake 0.45s ease;
      border-color: #FF453A !important;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }

    /* === 過關後「➡️ 下一題」特大按鈕 === */
    #next-question-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
    }

    #next-question-btn {
      background: #00FF66;
      color: #000000;
      border: 5px solid #000000;
      border-radius: 28px;
      padding: 14px 38px;
      font-size: clamp(1.35rem, 2.6vw, 1.9rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 34px rgba(0, 255, 102, 0.95), 0 8px 24px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
      animation: pulseNext 1.2s infinite ease-in-out;
    }

    #next-question-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulseNext {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* === 開始與回合結束畫面 === */
    #start-overlay, #break-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(9, 12, 18, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      z-index: 100;
      padding: 28px 20px 44px 20px;
      text-align: center;
      overflow-y: auto;
    }

    #break-overlay {
      display: none;
    }

    .trophy-icon {
      font-size: 5rem;
      margin-bottom: 6px;
    }

    .start-title, .break-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      color: #FFFF00;
      margin: 6px 0;
      letter-spacing: 1.5px;
    }

    .start-desc {
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      color: #FFFFFF;
      max-width: 680px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .break-stats {
      background: #181E29;
      border: 3px solid #FFFF00;
      border-radius: 20px;
      padding: 16px 30px;
      margin: 16px 0;
      color: #FFFFFF;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    .start-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .big-start-btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 18px 42px;
      font-size: 1.7rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 255, 0, 0.6);
    }

    .big-start-btn:active {
      transform: scale(0.95);
    }

    .secondary-setup-btn {
      background-color: #00E5FF;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 18px 28px;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
    }

    /* === 教師設定面板 === */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
      overflow-y: auto;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 840px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 22px;
      border: 2px solid var(--border-color);
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.35rem;
      color: #FFFF00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: #232732;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.45rem;
      font-weight: 900;
      color: #00FF66;
    }

    .stat-label {
      font-size: 0.82rem;
      color: #CCCCCC;
      margin-top: 3px;
    }

    .setting-group {
      margin-bottom: 16px;
    }

    .setting-group label {
      display: block;
      font-weight: 800;
      margin-bottom: 7px;
      font-size: 1.02rem;
      color: #EFEFEF;
    }

    .btn-group, .scene-check-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn, .scene-toggle-btn {
      background: #2A2E3B;
      color: #FFFFFF;
      border: 2px solid #484E60;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    .opt-btn.active, .scene-toggle-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }

    .btn-reset {
      background: #3A3A3C;
      color: #FF6B6B;
    }

    .btn-close {
      background: #00FF66;
      color: #000000;
      flex: 1;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 60;
      font-size: 2.2rem;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- 教師設定按鈕 -->
  <div id="teacher-trigger" title="開啟教師設定">
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </div>

  <!-- 頂部狀態欄 -->
  <div id="top-bar">
    <div class="top-badges-left">
      <div class="status-pill" id="topic-badge">主題 1 / 6</div>
    </div>
    <div id="progress-bar-container"></div>
    <button id="replay-speech-btn">🔊 讀題目</button>
  </div>

  <!-- 主遊戲舞台 -->
  <div id="main-container">
    <div id="question-banner">載入中...</div>
    <div id="story-illustration-box"></div>
    <div id="choices-row"></div>
  </div>

  <!-- 過關後「➡️ 下一題」特大按鈕 -->
  <div id="next-question-bar">
    <button id="next-question-btn">➡️ 下一題</button>
  </div>

  <!-- 開始畫面 -->
  <div id="start-overlay">
    <div class="trophy-icon">👼💛</div>
    <div class="start-title">友好小天使 Friendship Angel</div>
    <div class="start-desc">
      大班社交禮儀互動課！一齊睇圖畫、聽故事，<br/>
      揀出最有禮貌、最識交朋友嘅好方法啦！
    </div>
    <div class="start-actions-row">
      <button class="big-start-btn" id="start-game-btn">開始上課</button>
      <button class="secondary-setup-btn" id="open-setup-from-start-btn">⚙️ 教師選擇課題</button>
    </div>
  </div>

  <!-- 回合休息獎勵畫面 -->
  <div id="break-overlay">
    <div class="trophy-icon">🏆👼</div>
    <div class="break-title">做得好！你係友善小天使！</div>
    <div class="break-stats" id="break-stats-text"></div>
    <div class="start-actions-row">
      <button class="big-start-btn" id="continue-btn">再玩多一次</button>
    </div>
  </div>

  <!-- 教師設定面板 -->
  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 友好小天使 － 教師課程設定</h2>
        <span style="font-size: 0.88rem; color: #AAA;">可上下滑動查看全部設定</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">累計答對情境題數</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-first-try">0</div>
          <div class="stat-label">一次答對題數</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-accuracy">100%</div>
          <div class="stat-label">大班一次答對率</div>
        </div>
      </div>

      <!-- 1. 選擇要練習的社交課題（可多選） -->
      <div class="setting-group">
        <label>1. 課堂練習的社交故事課題（可自由勾選或全選）</label>
        <div class="scene-check-grid" id="scene-selector">
          <button class="scene-toggle-btn active" data-scene="greet">👋 1. 主動打招呼</button>
          <button class="scene-toggle-btn active" data-scene="join">🧱 2. 禮貌問一齊玩</button>
          <button class="scene-toggle-btn active" data-scene="queue">🛝 3. 排隊輪流玩</button>
          <button class="scene-toggle-btn active" data-scene="comfort">🩹 4. 安慰跌倒朋友</button>
          <button class="scene-toggle-btn active" data-scene="borrow">🖍️ 5. 有禮貌借東西</button>
          <button class="scene-toggle-btn active" data-scene="share">🍪 6. 大方分享食物</button>
        </div>
      </div>

      <!-- 2. 出題順序 -->
      <div class="setting-group">
        <label>2. 出題順序</label>
        <div class="btn-group" data-setting="orderMode">
          <button class="opt-btn active" data-val="sequential">按故事順序（由第 1 題至第 6 題，適合大班循序講解）</button>
          <button class="opt-btn" data-val="random">隨機抽題（適合小組搶答複習）</button>
        </div>
      </div>

      <!-- 3. 過關跳去下一題方式 -->
      <div class="setting-group">
        <label>3. 答對後跳去下一題方式</label>
        <div class="btn-group" data-setting="advanceMode">
          <button class="opt-btn" data-val="auto4">自動過關（答對後停留 4 秒自動跳去下一題）</button>
          <button class="opt-btn active" data-val="manual">手動按「➡️ 下一題」按鈕（大班課推薦，方便老師延伸討論）</button>
        </div>
      </div>

      <!-- 4. 畫面色彩對比 -->
      <div class="setting-group">
        <label>4. 畫面背景對比主題</label>
        <div class="btn-group" data-setting="theme">
          <button class="opt-btn active" data-val="dark">深黑高對比背景（低視能首選）</button>
          <button class="opt-btn" data-val="light">亮白高對比背景（大螢幕投影推薦）</button>
        </div>
      </div>

      <div class="panel-footer">
        <button class="action-btn btn-reset" id="reset-stats-btn">重設統計</button>
        <button class="action-btn btn-close" id="close-panel-btn">儲存並返回課堂</button>
      </div>
    </div>
  </div>

  <script>
    // === 6 幅全彩大型高清 SVG 社交故事插畫資料庫 ===
    const SOCIAL_SCENES = [
      {
        id: 'greet',
        shortTitle: '主動打招呼',
        question: '早晨返到學校見到同學，你會點做？',
        speechQuestion: '早晨返到學校見到同學，你會點做呀？',
        praiseSpeech: '做得好！笑住揮手講早晨，同學好開心呀！',
        retrySpeech: '唔好避開呀，試下笑住同同學講早晨啦！',
        options: [
