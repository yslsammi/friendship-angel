<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>友好小天使 Friendship Angel - 大班社交禮儀互動遊戲</title>
  <style>
    :root {
      --bg-color: #090C12;
      --card-bg: #181E29;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF66;
      --panel-bg: #16181F;
      --border-color: #444854;
    }

    body.light-theme {
      --bg-color: #F2F5FA;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #009933;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #main-container, #main-container * {
      touch-action: manipulation;
    }

    #start-overlay, #break-overlay, #teacher-panel, .panel-card {
      touch-action: manipulation;
      -webkit-overflow-scrolling: touch;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 0, 0.55);
      border-radius: 5px;
    }

    /* === 頂部狀態欄 === */
    #top-bar {
      position: fixed;
      top: 10px;
      left: 74px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      gap: 8px;
    }

    .top-badges-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.98rem;
      font-weight: 900;
      white-space: nowrap;
    }

    #progress-bar-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .progress-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 3px solid var(--card-border);
      background-color: transparent;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.filled {
      background-color: var(--card-border);
      transform: scale(1.15);
    }

    #replay-speech-btn {
      background: #FFFF00;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 20px;
      padding: 7px 15px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    #replay-speech-btn:active {
      transform: scale(0.95);
    }

    /* === 教師設定按鈕（左上角齒輪） === */
    #teacher-trigger {
      position: fixed;
      top: 10px;
      left: 12px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(80, 85, 95, 0.82);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      cursor: pointer;
    }

    #teacher-trigger svg.gear-icon {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
      pointer-events: none;
    }

    /* === 主遊戲舞台（全螢幕無捲動） === */
    #main-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 66px 18px 18px 18px;
      gap: 12px;
      overflow: hidden;
    }

    /* 故事介紹與題目橫幅 */
    #question-banner {
      width: 100%;
      max-width: 1220px;
      background-color: var(--card-bg);
      border: 5px solid var(--card-border);
      border-radius: 24px;
      padding: 12px 22px;
      text-align: center;
      font-size: clamp(1.3rem, 2.5vw, 2.1rem);
      font-weight: 900;
      color: var(--text-color);
      line-height: 1.35;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* 大型全彩 SVG 故事插畫框 */
    #story-illustration-box {
      width: 100%;
      max-width: 760px;
      flex: 1;
      min-height: 0;
      background-color: #131B2E;
      border: 7px solid #00E5FF;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    body.light-theme #story-illustration-box {
      background-color: #E8F4FF;
      border-color: #002868;
    }

    #story-illustration-box svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      display: block;
    }

    /* === 底部互動區域（階段一：開始選擇按鈕 / 階段二：大幅分開的兩個選項） === */
    #bottom-action-area {
      width: 100%;
      max-width: 1320px;
      min-height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0 6px;
    }

    /* 階段一：「開始選擇」特大按鈕（方便老師先做角色扮演再出示選項） */
    #reveal-choices-btn {
      background: #00FF66;
      color: #000000;
      border: 6px solid #FFFFFF;
      border-radius: 32px;
      padding: 20px 54px;
      font-size: clamp(1.55rem, 3vw, 2.3rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 36px rgba(0, 255, 102, 0.75), 0 8px 24px rgba(0, 0, 0, 0.6);
      letter-spacing: 2px;
      transition: transform 0.14s ease;
    }

    #reveal-choices-btn:active {
      transform: scale(0.95);
    }

    /* 階段二：兩個選項大幅拉開距離（左右靠邊，中間保留特大空白分隔） */
    #choices-row {
      width: 100%;
      display: none;
      justify-content: space-between;
      align-items: stretch;
      gap: clamp(48px, 10vw, 150px);
    }

    .choice-btn {
      flex: 1;
      max-width: 44%;
      background-color: var(--card-bg);
      border: 8px solid var(--btn-accent, #FFFF00);
      border-radius: 30px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      transition: transform 0.16s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.25s ease, box-shadow 0.2s ease;
      text-align: left;
    }

    @media (max-width: 760px) {
      #choices-row {
        flex-direction: column;
        gap: 24px;
      }
      .choice-btn {
        max-width: 100%;
      }
      #main-container {
        padding-top: 98px;
      }
    }

    .choice-btn:active {
      transform: scale(0.96);
    }

    /* 正在朗讀該選項內容時的發光高亮狀態 */
    .choice-btn.reading-now {
      background-color: #FFF59D !important;
      border-color: #FFFFFF !important;
      transform: scale(1.04);
      box-shadow: 0 0 50px rgba(255, 255, 0, 0.95);
    }

    .choice-btn.reading-now .choice-text {
      color: #000000 !important;
    }

    .choice-icon {
      font-size: clamp(2.6rem, 4.8vw, 3.8rem);
      line-height: 1;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: clamp(1.25rem, 2.2vw, 1.8rem);
      font-weight: 900;
      color: var(--subtext-color);
      line-height: 1.35;
    }

    /* 答對與答錯狀態 */
    .choice-btn.correct-selected {
      background-color: #00FF66 !important;
      border-color: #FFFFFF !important;
      transform: scale(1.04);
      box-shadow: 0 0 50px rgba(0, 255, 102, 0.95);
    }

    .choice-btn.correct-selected .choice-text {
      color: #000000 !important;
    }

    .choice-btn.faded-out {
      opacity: 0.22;
      pointer-events: none;
    }

    .choice-btn.gentle-shake {
      animation: gentleShake 0.45s ease;
      border-color: #FF453A !important;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }

    /* === 過關後「➡️ 下一題」特大按鈕 === */
    #next-question-bar {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
    }

    #next-question-btn {
      background: #00FF66;
      color: #000000;
      border: 5px solid #000000;
      border-radius: 28px;
      padding: 15px 40px;
      font-size: clamp(1.4rem, 2.6vw, 1.95rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 34px rgba(0, 255, 102, 0.95), 0 8px 24px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
      animation: pulseNext 1.2s infinite ease-in-out;
    }

    #next-question-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulseNext {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* === 開始與回合結束畫面 === */
    #start-overlay, #break-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(9, 12, 18, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 28px 20px 44px 20px;
      text-align: center;
      overflow-y: auto;
    }

    #break-overlay {
      display: none;
    }

    .trophy-icon {
      font-size: 5rem;
      margin-bottom: 6px;
    }

    .start-title, .break-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      color: #FFFF00;
      margin: 6px 0;
      letter-spacing: 1.5px;
    }

    .start-desc {
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      color: #FFFFFF;
      max-width: 720px;
      line-height: 1.65;
      margin-bottom: 24px;
    }

    .break-stats {
      background: #181E29;
      border: 3px solid #FFFF00;
      border-radius: 20px;
      padding: 16px 30px;
      margin: 16px 0;
      color: #FFFFFF;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    .start-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      position: relative;
      z-index: 120;
    }

    .big-start-btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 20px 46px;
      font-size: 1.75rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 255, 0, 0.6);
      -webkit-appearance: none;
    }

    .big-start-btn:active {
      transform: scale(0.95);
    }

    .secondary-setup-btn {
      background-color: #00E5FF;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 20px 30px;
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
      -webkit-appearance: none;
    }

    /* === 教師設定面板 === */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
      overflow-y: auto;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 860px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 22px;
      border: 2px solid var(--border-color);
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.35rem;
      color: #FFFF00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: #232732;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.45rem;
      font-weight: 900;
      color: #00FF66;
    }

    .stat-label {
      font-size: 0.82rem;
      color: #CCCCCC;
      margin-top: 3px;
    }

    .setting-group {
      margin-bottom: 16px;
    }

    .setting-group label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 1.02rem;
      color: #EFEFEF;
      flex-wrap: wrap;
      gap: 8px;
    }

    .select-all-mini-btn {
      background: #00E5FF;
      color: #000000;
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-group, .scene-check-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn, .scene-toggle-btn {
      background: #2A2E3B;
      color: #FFFFFF;
      border: 2px solid #484E60;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    .opt-btn.active, .scene-toggle-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }

    .btn-reset {
      background: #3A3A3C;
      color: #FF6B6B;
    }

    .btn-close {
      background: #00FF66;
      color: #000000;
      flex: 1;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 60;
      font-size: 2.2rem;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- 教師設定按鈕 -->
  <button type="button" id="teacher-trigger" title="開啟教師設定">
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </button>

  <!-- 頂部狀態欄 -->
  <div id="top-bar">
    <div class="top-badges-left">
      <div class="status-pill" id="topic-badge">主題 1 / 10</div>
    </div>
    <div id="progress-bar-container"></div>
    <button type="button" id="replay-speech-btn">🔊 再聽故事</button>
  </div>

  <!-- 主遊戲舞台 -->
  <div id="main-container">
    <div id="question-banner">載入中...</div>
    <div id="story-illustration-box"></div>

    <!-- 底部區域：先按「👉 開始選擇」，再出現大幅分開的兩個選項 -->
    <div id="bottom-action-area">
      <button type="button" id="reveal-choices-btn">👉 開始選擇</button>
      <div id="choices-row"></div>
    </div>
  </div>

  <!-- 過關後「➡️ 下一題」特大按鈕 -->
  <div id="next-question-bar">
    <button type="button" id="next-question-btn">➡️ 下一題</button>
  </div>

  <!-- 開始畫面 -->
  <div id="start-overlay">
    <div class="trophy-icon">👼💛</div>
    <div class="start-title">友好小天使 Friendship Angel</div>
    <div class="start-desc">
      大班社交禮儀互動課（共 10 個社交故事）！<br/>
      先一齊睇圖畫、聽故事介紹，角色扮演後再撳掣揀出好方法！
    </div>
    <div class="start-actions-row">
      <button type="button" class="big-start-btn" id="start-game-btn">開始上課</button>
      <button type="button" class="secondary-setup-btn" id="open-setup-from-start-btn">⚙️ 教師選擇課題</button>
    </div>
  </div>

  <!-- 回合休息獎勵畫面 -->
  <div id="break-overlay">
    <div class="trophy-icon">🏆👼</div>
    <div class="break-title">做得好！你係友善小天使！</div>
    <div class="break-stats" id="break-stats-text"></div>
    <div class="start-actions-row">
      <button type="button" class="big-start-btn" id="continue-btn">再玩多一次</button>
    </div>
  </div>

  <!-- 教師設定面板 -->
  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 友好小天使 － 教師課程設定</h2>
        <span style="font-size: 0.88rem; color: #AAA;">可上下滑動查看全部設定</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">累計答對情境題數</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-first-try">0</div>
          <div class="stat-label">一次答對題數</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-accuracy">100%</div>
          <div class="stat-label">大班一次答對率</div>
        </div>
      </div>

      <!-- 1. 選擇要練習的社交課題（共 10 個課題，可多選） -->
      <div class="setting-group">
        <label>
          <span>1. 課堂練習的社交故事課題（共 10 題，可自由勾選）</span>
          <button type="button" class="select-all-mini-btn" id="select-all-scenes-btn">✅ 全選 10 題</button>
        </label>
        <div class="scene-check-grid" id="scene-selector">
          <button type="button" class="scene-toggle-btn active" data-scene="greet">👋 1. 主動打招呼</button>
          <button type="button" class="scene-toggle-btn active" data-scene="join">🧱 2. 禮貌問一齊玩</button>

        advanceMode: 'manual',
        theme: 'dark'
      },
      stats: {
        totalCompleted: 0,
        firstTryCorrect: 0,
        totalAttempts: 0
      }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.settings) state.settings = { ...state.settings, ...parsed.settings };
          if (parsed.stats) state.stats = { ...state.stats, ...parsed.stats };
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    const runtime = {
      activeQueue: [],
      currentIndex: 0,
      currentScene: null,
      hadMistakeThisQuestion: false,
      isAnswered: false,
      isEvaluatingChoice: false,
      choicesRevealed: false,
      autoNextTimer: null
    };

    const questionBanner = document.getElementById('question-banner');
    const storyBox = document.getElementById('story-illustration-box');
    const revealChoicesBtn = document.getElementById('reveal-choices-btn');
    const choicesRow = document.getElementById('choices-row');
    const topicBadge = document.getElementById('topic-badge');
    const progressBarContainer = document.getElementById('progress-bar-container');
    const nextQuestionBar = document.getElementById('next-question-bar');
    const nextQuestionBtn = document.getElementById('next-question-btn');

    loadState();

    // === 音效與廣東話語音引擎 ===
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    function playSuccessChime() {
      initAudio();
      if (!audioCtx) return;
      try {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const now = audioCtx.currentTime + idx * 0.08;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        });
      } catch (e) {}
    }

    function playGentleErrorTone() {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    let cantoneseVoice = null;
    let speechTimer = null;
    let fallbackCallbackTimer = null;

    function loadCantoneseVoice() {
      try {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice =
          voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
          voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
          null;
      } catch (e) {}
    }

    try {
      if ('speechSynthesis' in window) {
        loadCantoneseVoice();
        window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
      }
    } catch (e) {}

    function speakCantonese(text, onComplete) {
      if (speechTimer) clearTimeout(speechTimer);
      if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);

      if (!('speechSynthesis' in window) || !text) {
        if (onComplete) setTimeout(onComplete, 900);
        return;
      }

      try {
        window.speechSynthesis.cancel();
      } catch (e) {}

      let callbackFired = false;
      const fireOnce = () => {
        if (callbackFired) return;
        callbackFired = true;
        if (fallbackCallbackTimer) clearTimeout(fallbackCallbackTimer);
        if (onComplete) onComplete();
      };

      const estimatedMs = Math.max(1600, String(text).length * 240 + 700);
      if (onComplete) {
        fallbackCallbackTimer = setTimeout(fireOnce, estimatedMs);
      }

      speechTimer = setTimeout(() => {
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          const utter = new SpeechSynthesisUtterance(String(text));
          utter.lang = 'zh-HK';
          if (cantoneseVoice) utter.voice = cantoneseVoice;
          utter.rate = 0.88;
          utter.pitch = 1.15;
          utter.onend = () => {
            setTimeout(fireOnce, 450);
          };
          utter.onerror = () => {
            setTimeout(fireOnce, 450);
          };
          window.speechSynthesis.speak(utter);
        } catch (err) {
          fireOnce();
        }
      }, 50);
    }

    // === 建立題目隊列 ===
    function buildQuestionQueue() {
      const enabled = state.settings.enabledScenes;
      let list = SOCIAL_SCENES.filter(s => enabled.includes(s.id));
      if (list.length === 0) list = [...SOCIAL_SCENES];

      if (state.settings.orderMode === 'random') {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }
      runtime.activeQueue = list;
      runtime.currentIndex = 0;
    }

    // === 載入目前情境題目（第一步：先介紹圖片，顯示「👉 開始選擇」） ===
    function loadCurrentScene() {
      if (runtime.autoNextTimer) {
        clearTimeout(runtime.autoNextTimer);
        runtime.autoNextTimer = null;
      }
      nextQuestionBar.style.display = 'none';
      runtime.hadMistakeThisQuestion = false;
      runtime.isAnswered = false;
      runtime.isEvaluatingChoice = false;
      runtime.choicesRevealed = false;

      if (runtime.currentIndex >= runtime.activeQueue.length) {
        showRoundComplete();
        return;
      }

      const scene = runtime.activeQueue[runtime.currentIndex];
      runtime.currentScene = scene;

      topicBadge.textContent = `主題 ${runtime.currentIndex + 1} / ${runtime.activeQueue.length}：${scene.shortTitle}`;
      updateProgressDots();

      questionBanner.textContent = `🖼️ ${scene.storyIntro}`;
      storyBox.innerHTML = scene.svg;

      choicesRow.style.display = 'none';
      choicesRow.innerHTML = '';
      revealChoicesBtn.style.display = 'inline-block';

      speakCantonese(scene.speechIntro);
    }

    // === 第二步：老師按「👉 開始選擇」後，才顯示大幅分開的兩個選項 ===
    revealChoicesBtn.addEventListener('click', () => {
      initAudio();
      if (!runtime.currentScene) return;
      runtime.choicesRevealed = true;
      revealChoicesBtn.style.display = 'none';

      const scene = runtime.currentScene;
      questionBanner.textContent = `❓ ${scene.question}`;

      const shuffledOptions = [...scene.options].sort(() => Math.random() - 0.5);
      const sideColors = ['#FFFF00', '#00E5FF'];

      choicesRow.innerHTML = '';
      shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-btn';
        btn.style.setProperty('--btn-accent', sideColors[idx % sideColors.length]);
        btn.innerHTML = `
          <div class="choice-icon">${opt.icon}</div>
          <div class="choice-text">${opt.text}</div>
        `;
        btn.addEventListener('click', () => handleChoiceClick(opt, btn));
        choicesRow.appendChild(btn);
      });

      choicesRow.style.display = 'flex';
      speakCantonese(scene.question);
    });

    // === 第三步：按下選項後「先讀出選項內容，讀完先至揭曉對錯」 ===
    function handleChoiceClick(opt, btnEl) {
      if (runtime.isAnswered || runtime.isEvaluatingChoice) return;
      initAudio();

      runtime.isEvaluatingChoice = true;

      choicesRow.querySelectorAll('.choice-btn').forEach(b => {
        b.classList.remove('reading-now', 'gentle-shake');
      });
      btnEl.classList.add('reading-now');
      questionBanner.textContent = `🗣️ 「${opt.text}」`;

      speakCantonese(opt.spokenText, () => {
        btnEl.classList.remove('reading-now');
        evaluateSelectedOption(opt, btnEl);
      });
    }

    function evaluateSelectedOption(opt, btnEl) {
      state.stats.totalAttempts += 1;

      if (opt.isCorrect) {
        runtime.isAnswered = true;
        runtime.isEvaluatingChoice = false;
        state.stats.totalCompleted += 1;
        if (!runtime.hadMistakeThisQuestion) {
          state.stats.firstTryCorrect += 1;
        }
        saveState();
        updateStatsUI();

        btnEl.classList.add('correct-selected');
        choicesRow.querySelectorAll('.choice-btn').forEach(b => {
          if (b !== btnEl) b.classList.add('faded-out');
        });

        playSuccessChime();
        try { if (navigator.vibrate) navigator.vibrate(50); } catch (e) {}

        const rect = btnEl.getBoundingClientRect();
        spawnHeartParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

        questionBanner.textContent = `🌟 ${runtime.currentScene.praiseSpeech}`;
        speakCantonese(runtime.currentScene.praiseSpeech);

        updateProgressDots(true);

        const isLast = (runtime.currentIndex + 1 >= runtime.activeQueue.length);
        nextQuestionBtn.textContent = isLast ? '🏆 完成本課堂！查看獎勵' : '➡️ 下一題';
        nextQuestionBar.style.display = 'block';

        if (state.settings.advanceMode === 'auto4') {
          runtime.autoNextTimer = setTimeout(() => {
            advanceToNextQuestion();
          }, 4000);
        }
      } else {
        runtime.hadMistakeThisQuestion = true;
        runtime.isEvaluatingChoice = false;
        saveState();
        updateStatsUI();

        playGentleErrorTone();
        btnEl.classList.remove('gentle-shake');
        void btnEl.offsetWidth;
        btnEl.classList.add('gentle-shake');

        questionBanner.textContent = `💡 ${runtime.currentScene.retrySpeech}`;
        speakCantonese(runtime.currentScene.retrySpeech);
      }
    }

    function advanceToNextQuestion() {
      if (runtime.autoNextTimer) {
        clearTimeout(runtime.autoNextTimer);
        runtime.autoNextTimer = null;
      }
      nextQuestionBar.style.display = 'none';
      runtime.currentIndex += 1;
      loadCurrentScene();
    }

    nextQuestionBtn.addEventListener('click', () => {
      initAudio();
      advanceToNextQuestion();
    });

    document.getElementById('replay-speech-btn').addEventListener('click', () => {
      initAudio();
      if (!runtime.currentScene) return;
      if (!runtime.choicesRevealed) {
        speakCantonese(runtime.currentScene.speechIntro);
      } else {
        speakCantonese(runtime.currentScene.question);
      }
    });

    // === 愛心與星星慶祝粒子 ===
    function spawnHeartParticles(cx, cy) {
      const symbols = ['💛', '❤️', '⭐', '👼', '✨'];
      for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = symbols[i % symbols.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);

        const angle = (Math.PI * 2 * i) / 14;
        const dist = 90 + Math.random() * 140;
        p.animate([
          { transform: 'translate(-50%, -50%) scale(0.8)', opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist - 60}px)) scale(1.4)`, opacity: 0 }
        ], {
          duration: 850,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => p.remove();
      }
    }

    // === 進度小圓點 ===
    function updateProgressDots(currentJustCompleted = false) {
      progressBarContainer.innerHTML = '';
      const total = runtime.activeQueue.length;
      const completedCount = runtime.currentIndex + (currentJustCompleted ? 1 : 0);

      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot' + (i < completedCount ? ' filled' : '');
        progressBarContainer.appendChild(dot);
      }
    }

    // === 課堂結束獎勵畫面 ===
    function showRoundComplete() {
      playSuccessChime();
      speakCantonese('做得好！今日全部社交小故事都完成啦，大家都係友善小天使！');

      document.getElementById('break-stats-text').innerHTML = `
        本課堂完成社交主題：<strong>${runtime.activeQueue.length}</strong> 個<br/>
        累計答對題數：<strong>${state.stats.totalCompleted}</strong> 題
      `;
      document.getElementById('break-overlay').style.display = 'flex';
    }

    document.getElementById('continue-btn').addEventListener('click', () => {
      initAudio();
      document.getElementById('break-overlay').style.display = 'none';
      buildQuestionQueue();
      loadCurrentScene();
    });

    // === 開始遊戲 ===
    function handleStartClass() {
      const overlay = document.getElementById('start-overlay');
      if (overlay) overlay.style.display = 'none';
      initAudio();
      loadCantoneseVoice();
      buildQuestionQueue();
      loadCurrentScene();
    }

    document.getElementById('start-game-btn').addEventListener('click', handleStartClass);

    // === 教師設定面板控制 ===
    const teacherPanel = document.getElementById('teacher-panel');

    function openTeacherPanel() {
      if (runtime.autoNextTimer) {
        clearTimeout(runtime.autoNextTimer);
        runtime.autoNextTimer = null;
      }
      applySettingsUI();
      updateStatsUI();
      teacherPanel.style.display = 'flex';
    }

    document.getElementById('teacher-trigger').addEventListener('click', openTeacherPanel);
    document.getElementById('open-setup-from-start-btn').addEventListener('click', openTeacherPanel);

    document.getElementById('select-all-scenes-btn').addEventListener('click', () => {
      state.settings.enabledScenes = [...ALL_SCENE_IDS];
      applySettingsUI();
      saveState();
    });

    document.querySelectorAll('.scene-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sceneId = btn.dataset.scene;
        const list = state.settings.enabledScenes;
        if (list.includes(sceneId)) {
          if (list.length > 1) {
            state.settings.enabledScenes = list.filter(id => id !== sceneId);
          }
        } else {
          state.settings.enabledScenes.push(sceneId);
        }
        applySettingsUI();
        saveState();
      });
    });

    document.querySelectorAll('.btn-group').forEach(group => {
      const key = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.settings[key] = btn.dataset.val;
          applySettingsUI();
          saveState();
        });
      });
    });

    function applySettingsUI() {
      const s = state.settings;
      document.body.classList.toggle('light-theme', s.theme === 'light');

      document.querySelectorAll('.scene-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', s.enabledScenes.includes(btn.dataset.scene));
      });

      document.querySelectorAll('.btn-group').forEach(group => {
        const key = group.dataset.setting;
        const val = String(s[key]);
        group.querySelectorAll('.opt-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.val === val);
        });
      });
    }

    function updateStatsUI() {
      const st = state.stats;
      document.getElementById('stat-total').textContent = st.totalCompleted;
      document.getElementById('stat-first-try').textContent = st.firstTryCorrect;
      const acc = st.totalAttempts > 0 ? Math.round((st.firstTryCorrect / st.totalAttempts) * 100) : 100;
      document.getElementById('stat-accuracy').textContent = `${acc}%`;
    }

    document.getElementById('reset-stats-btn').addEventListener('click', () => {
      state.stats.totalCompleted = 0;
      state.stats.firstTryCorrect = 0;
      state.stats.totalAttempts = 0;
      saveState();
      updateStatsUI();
    });

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      teacherPanel.style.display = 'none';
      if (document.getElementById('start-overlay').style.display === 'none') {
        buildQuestionQueue();
        loadCurrentScene();
      }
    });

    applySettingsUI();
  </script>
</body>
</html>
